name: BelivrHQ Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, staging]

# Application deployment is handled by the Vercel Git integration.
# This workflow validates changes and applies checked-in Prisma migrations
# to the matching branch database after all checks pass.
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: belivrhq
          POSTGRES_PASSWORD: belivrhq_test
          POSTGRES_DB: belivrhq_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3001
      WEB_URL: http://localhost:3000
      DATABASE_URL: postgresql://belivrhq:belivrhq_test@localhost:5433/belivrhq_test
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_JWT_SECRET: test-jwt-secret
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: belivrhq
          POSTGRES_PASSWORD: belivrhq_test
          POSTGRES_DB: belivrhq_e2e_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://belivrhq:belivrhq_test@localhost:5433/belivrhq_e2e_test
      TEST_DATABASE_URL: postgresql://belivrhq:belivrhq_test@localhost:5433/belivrhq_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:e2e:prepare
      - run: npx prisma migrate deploy
      - run: npm run test:e2e

  migrate:
    name: Deploy database migrations
    runs-on: ubuntu-latest
    needs: [lint, test, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: prisma-migrate-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Add DATABASE_URL separately to production and staging GitHub environments.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Validate migration connection
        run: |
          node <<'NODE'
          const value = process.env.DATABASE_URL;
          if (!value) {
            console.error('::error::Set DATABASE_URL in the matching production or staging GitHub environment.');
            process.exit(1);
          }
          let connection;
          try { connection = new URL(value); } catch { /* Report no credential details. */ }
          if (!connection || !['postgres:', 'postgresql:'].includes(connection.protocol)) {
            console.error('::error::DATABASE_URL must be a PostgreSQL connection string, not the Supabase HTTPS API URL.');
            process.exit(1);
          }
          NODE
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply pending migrations
        run: npx prisma migrate deploy
