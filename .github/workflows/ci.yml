name: BelivrHQ Backend CI

permissions:
  contents: read

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, staging]

# Git auto-deployments are disabled. Only the release job may deploy after all checks pass.
# Worker hosting remains deferred independently of this deployment gate.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://localhost:5432/dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm run env:git:check
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:scripts
      - run: npm run release:test
      - run: npm run readiness:smoke:check
      - run: npm run ops:test
      - run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: belivrhq
          POSTGRES_PASSWORD: belivrhq_test
          POSTGRES_DB: belivrhq_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3001
      WEB_URL: http://localhost:3000
      DATABASE_URL: postgresql://belivrhq:belivrhq_test@localhost:5433/belivrhq_test
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_JWT_SECRET: test-jwt-secret
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:cov -- --runInBand
      - name: Retain coverage evidence even when the threshold fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-unit-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  docker-context:
    name: Private Docker context boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Start Docker for mandatory context and runtime checks
        run: sudo systemctl start docker
      - run: npm run ops:test:docker-context
        env:
          REQUIRE_DOCKER_TESTS: '1'
      - name: Build the worker container without private configuration
        run: docker build --target worker --tag belivrhq-worker:ci .
      - name: Verify packaged runtime dependencies
        run: docker run --rm --entrypoint node belivrhq-worker:ci -e "require('@prisma/client'); require('sharp'); require('./dist/health/health.service.js')"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: belivrhq
          POSTGRES_PASSWORD: belivrhq_test
          POSTGRES_DB: belivrhq_e2e_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://belivrhq:belivrhq_test@localhost:5433/belivrhq_e2e_test
      TEST_DATABASE_URL: postgresql://belivrhq:belivrhq_test@localhost:5433/belivrhq_e2e_test
      SMOKE_DATABASE_URL: postgresql://belivrhq:belivrhq_test@localhost:5433/belivrhq_e2e_test
      SMOKE_REDIS_URL: redis://127.0.0.1:6380
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:e2e:prepare
      - run: npx prisma migrate deploy
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run readiness:smoke
      - name: Verify isolated database backup, restore and privilege preservation
        run: npm run ops:test:integration
        env:
          OPS_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          OPS_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}

  audit:
    name: Backend dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run security:test
      - run: npm run security:audit

  checks:
    name: Required backend checks
    runs-on: ubuntu-latest
    needs: [lint, test, e2e, docker-context, audit]
    if: always()
    steps:
      - name: Refuse failed, skipped or cancelled validation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if (Object.values(JSON.parse(process.env.RESULTS)).some(job => job.result !== "success")) process.exit(1)'

  pull-requests:
    name: Open checked pull requests
    runs-on: ubuntu-latest
    needs: checks
    if: vars.AUTOMATIC_RELEASE_PRS == 'true' && github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging'
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: backend-pull-requests-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Create or reuse main and staging PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-pull-requests.cjs

  prepare:
    name: Prepare checked backend
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [primary]
    permissions:
      contents: read
    environment:
      name: ${{ matrix.profile == 'legacy' && (github.ref_name == 'main' && 'legacy-production' || 'legacy-staging') || (github.ref_name == 'main' && 'production' || 'staging') }}
    concurrency:
      group: backend-release-${{ matrix.profile }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Add DATABASE_URL separately to production and staging GitHub environments.
      DATABASE_URL: postgresql://localhost:5432/dummy
      RELEASE_PROFILE: ${{ matrix.profile }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      BACKEND_RELEASE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Validate migration connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const value = process.env.DATABASE_URL;
          if (!value) {
            console.error('::error::Set DATABASE_URL in the matching production or staging GitHub environment.');
            process.exit(1);
          }
          let connection;
          try { connection = new URL(value); } catch { /* Report no credential details. */ }
          if (!connection || !['postgres:', 'postgresql:'].includes(connection.protocol)) {
            console.error('::error::DATABASE_URL must be a PostgreSQL connection string, not the Supabase HTTPS API URL.');
            process.exit(1);
          }
          NODE
      - name: Install pinned deployment CLI
        run: npm install --global vercel@65.9.0
      - name: Validate release configuration and checked branch head
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release-backend.cjs preflight
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy
      - name: Seed missing default roles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run prisma:seed-production
      - name: Build candidate and verify readiness
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release-backend.cjs prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-candidate-${{ matrix.profile }}
          path: .ops/release-candidate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  promote:
    name: Promote checked backend
    runs-on: ubuntu-latest
    needs: prepare
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [primary]
    environment:
      name: ${{ matrix.profile == 'legacy' && (github.ref_name == 'main' && 'legacy-production' || 'legacy-staging') || (github.ref_name == 'main' && 'production' || 'staging') }}
    concurrency:
      group: backend-promotion-${{ matrix.profile }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_PROFILE: ${{ matrix.profile }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      BACKEND_RELEASE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-candidate-${{ matrix.profile }}
          path: .ops
      - run: npm install --global vercel@65.9.0
      - name: Revalidate checked candidate and promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release-backend.cjs promote
